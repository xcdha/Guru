# Guru Server — 本地/内网快速部署
#
# 用法：
#   docker compose -f apps/server/docker-compose.yml up -d
# 然后客户端连接 http://localhost:8787
#
# 生产环境务必设置 GURU_SERVER_JWT_SECRET 为强随机值。

services:
  guru-server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    container_name: guru-server
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      GURU_SERVER_DB: /data/guru-server.db
      GURU_SERVER_SKILLS_DIR: /data/skills
      GURU_SERVER_JWT_SECRET: ${GURU_SERVER_JWT_SECRET:-change-me-in-production}
    volumes:
      - guru-server-data:/data
    restart: unless-stopped

volumes:
  guru-server-data:
